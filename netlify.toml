# Netlify build & deploy configuration
# Connect this GitHub repo in Netlify (Add new site → Import from Git) and every
# push to `main` deploys to production; every pull request gets a deploy preview.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Local development: `npm run dev:netlify` (needs `npm i -g netlify-cli`)
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Single-page app fallback. API routes are served by the `api` function
# (its `/api/*` path takes precedence over this rule).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
